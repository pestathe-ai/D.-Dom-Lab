name: dom_lab
description: Dom, assistente vocale che comanda il telefono. Tutto sul telefono, gratis, senza cloud.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0
  path_provider: ^2.1.6
  # AI sul telefono (LiteRT-LM di Google, gira sulla GPU, niente cloud).
  # Stesso motore e stesso modello (Gemma 4 E2B) di D. Paper Lab.
  flutter_edge_ai: ^2.5.0
  flutter_edge_ai_litertlm: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Sora (Google Fonts, licenza OFL): il carattere di Dom Studio.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
