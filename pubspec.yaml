name: dom_lab
description: Dom, assistente vocale che comanda il telefono, con Gemini (piano gratuito).
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0
  path_provider: ^2.1.6
  # Gemini via internet (piano gratuito): il telefono resta leggero.
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Sora (Google Fonts, licenza OFL): il carattere di Dom Studio.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
